# Lefthook による Git フック一元管理
# 実際の処理は既存の scripts/git-sync.mjs に委譲し、
# 移行コストを最小化しつつフック定義を YAML で一元管理する。

pre-commit:
  commands:
    git-sync:
      run: node scripts/git-sync.mjs pre-commit

pre-push:
  commands:
    git-sync:
      run: node scripts/git-sync.mjs pre-push

post-merge:
  commands:
    git-sync:
      run: node scripts/git-sync.mjs post-merge

post-rewrite:
  commands:
    git-sync:
      run: node scripts/git-sync.mjs post-rewrite

post-checkout:
  commands:
    git-sync:
      run: node scripts/git-sync.mjs post-checkout "$@"
